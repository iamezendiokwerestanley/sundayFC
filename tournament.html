<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunday FC - Tournament Draft Selector</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #1e293b;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--secondary);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 16px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Setup / Pots Overview */
        .pots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .pot-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 12px;
        }

        .pot-card h3 {
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .pot-card span {
            font-size: 0.75rem;
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .pot-card ul {
            list-style: none;
            font-size: 0.85rem;
            color: var(--text-muted);
            padding-left: 0;
        }

        .pot-card li {
            padding: 2px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        /* Draft Arena */
        .draft-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
        }

        .current-picker-info h2 {
            font-size: 1.2rem;
            color: var(--primary);
        }

        .current-picker-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .round-badge {
            background: var(--secondary);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .pots-selection-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .pots-selection-box h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: var(--text);
        }

        .pot-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .pot-pick-btn {
            background: #334155;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            text-align: left;
        }

        .pot-pick-btn:hover:not(:disabled) {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        .pot-pick-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .pot-pick-btn span {
            display: block;
            font-size: 0.75rem;
            opacity: 0.8;
        }

        /* Roulette Animation Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--secondary);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            border: 1px solid var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .roulette-box {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent);
            margin: 20px 0;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }

        /* Teams Overview Grid */
        .teams-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .team-card {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 10px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .team-card h4 {
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }

        .team-card ul {
            list-style: none;
            font-size: 0.9rem;
        }

        .team-card li {
            padding: 4px 0;
            display: flex;
            justify-content: space-between;
            color: var(--text);
        }

        .team-card li span.role {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Sunday FC Tournament Draft</h1>
            <p>December 1st &amp; 2nd Week • 4 Teams (5-a-side + 1 Sub)</p>
        </header>

        <!-- SCREEN 1: POTS OVERVIEW -->
        <div id="screen-pots" class="screen active">
            <h2 style="font-size: 1.1rem; margin-bottom: 12px; color: var(--text);">Squad &amp; Pot Breakdown</h2>
            <div class="pots-grid" id="pots-preview"></div>
            <button class="btn" onclick="startDraft()">Start Captains' Draft</button>
        </div>

        <!-- SCREEN 2: DRAFT ROOM -->
        <div id="screen-draft" class="screen">
            <div class="draft-header">
                <div class="current-picker-info">
                    <span style="font-size: 0.75rem; color: var(--text-muted);">ON THE CLOCK</span>
                    <h2 id="picker-name">Captain Name</h2>
                    <p id="picker-team">Team 1</p>
                </div>
                <div class="round-badge" id="round-indicator">Round 1</div>
            </div>

            <div class="pots-selection-box">
                <h3>Select a Pot to Draft From:</h3>
                <div class="pot-buttons" id="pot-buttons-container">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <h3 style="font-size: 1rem; margin-bottom: 10px;">Live Rosters</h3>
            <div class="teams-container" id="live-teams-container">
                <!-- Populated dynamically -->
            </div>
        </div>

        <!-- SCREEN 3: FINAL ROSTERS -->
        <div id="screen-result" class="screen">
            <h2 style="text-align: center; color: var(--primary); margin-bottom: 16px;">Tournament Teams Locked! 🎉</h2>
            <div class="teams-container" id="final-teams-container"></div>
            <button class="btn" onclick="resetDraft()">Reset &amp; Redraft</button>
        </div>
    </div>

    <!-- ROULETTE ANIMATION MODAL -->
    <div class="modal" id="roulette-modal">
        <div class="modal-content">
            <h3 id="modal-title" style="color: var(--accent);">Selecting Player...</h3>
            <div class="roulette-box" id="roulette-display">...</div>
            <p id="modal-subtext" style="font-size: 0.85rem; color: var(--text-muted);">Spinning the pot...</p>
        </div>
    </div>

    <script>
        // Data Structure
        const pots = {
            1: { name: "Pot 1 (Goalkeepers / Captains)", role: "GK / Captain", players: ["Chekwube", "Mr Val", "Obinmna", "Olago"] },
            2: { name: "Pot 2 (Strikers)", role: "Striker", players: ["Ebuka", "Osy", "Ifeanyi", "Chidi"] },
            3: { name: "Pot 3 (Defenders)", role: "Defender", players: ["Nweke", "Sammy", "Ibro", "Otigba"] },
            4: { name: "Pot 4 (Midfielders)", role: "Midfielder", players: ["Ekene", "Psalmz", "Vincent", "Chigbo"] },
            5: { name: "Pot 5 (Attackers)", role: "Attacker", players: ["Smart", "Stan", "Kodiri", "Emeka"] },
            6: { name: "Pot 6 (Impact Subs)", role: "Substitute", players: ["CJ", "Emmy", "Chibuike", "Somto"] }
        };

        let teams = [];
        let currentCaptainIndex = 0;
        let currentRound = 1; // Round 1: Pot 2, Round 2: Pot 3, Round 3: Pot 4, Round 4: Pot 5, Round 5: Pot 6
        let availablePots = [2, 3, 4, 5, 6];

        // Initialize display on load
        function initPotsPreview() {
            const container = document.getElementById('pots-preview');
            container.innerHTML = '';
            for (let p in pots) {
                container.innerHTML += `
                    <div class="pot-card">
                        <h3>${pots[p].name.split(' ')[0]} ${pots[p].name.split(' ')[1]} <span>${pots[p].players.length} players</span></h3>
                        <p style="font-size:0.75rem; color:var(--accent); margin-bottom:6px;">${pots[p].role}</p>
                        <ul>
                            ${pots[p].players.map(pl => `<li>${pl}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
        }
        initPotsPreview();

        function startDraft() {
            // Initialize 4 teams with Pot 1 captains
            teams = pots[1].players.map((gk, index) => ({
                id: index + 1,
                name: `Team ${index + 1} (${gk})`,
                captain: gk,
                roster: [{ name: gk, role: 'GK / Captain' }]
            }));

            currentCaptainIndex = 0;
            currentRound = 1;
            availablePots = [2, 3, 4, 5, 6];

            document.getElementById('screen-pots').classList.remove('active');
            document.getElementById('screen-draft').classList.add('active');
            updateDraftUI();
        }

        function updateDraftUI() {
            if (currentRound > 5) {
                // Draft finished!
                document.getElementById('screen-draft').classList.remove('active');
                document.getElementById('screen-result').classList.add('active');
                renderFinalTeams();
                return;
            }

            const currentTeam = teams[currentCaptainIndex];
            document.getElementById('picker-name').innerText = currentTeam.captain;
            document.getElementById('picker-team').innerText = currentTeam.name;
            document.getElementById('round-indicator').innerText = `Round ${currentRound} / 5`;

            // Render Pot selection buttons
            const potButtonsContainer = document.getElementById('pot-buttons-container');
            potButtonsContainer.innerHTML = '';
            
            availablePots.forEach(potNum => {
                const potData = pots[potNum];
                const isAvailable = potData.players.length > 0;
                potButtonsContainer.innerHTML += `
                    <button class="pot-pick-btn" ${!isAvailable ? 'disabled' : ''} onclick="pickFromPot(${potNum})">
                        <strong>${potData.name.split('(')[0]}</strong>
                        <span>${potData.role} (${potData.players.length} left)</span>
                    </button>
                `;
            });

            renderLiveTeams();
        }

        function pickFromPot(potNum) {
            const potData = pots[potNum];
            if (potData.players.length === 0) return;

            // Show roulette animation modal
            const modal = document.getElementById('roulette-modal');
            const display = document.getElementById('roulette-display');
            const subtext = document.getElementById('modal-subtext');
            modal.style.display = 'flex';
            subtext.innerText = `Drawing from ${pots[potNum].name}...`;

            let counter = 0;
            const candidates = potData.players;
            const interval = setInterval(() => {
                display.innerText = candidates[Math.floor(Math.random() * candidates.length)];
                counter++;
                if (counter > 12) {
                    clearInterval(interval);
                    // Final pick
                    const randomIndex = Math.floor(Math.random() * candidates.length);
                    const chosenPlayer = candidates.splice(randomIndex, 1)[0];
                    
                    display.innerText = `✨ ${chosenPlayer} ✨`;
                    subtext.innerText = `Joined ${teams[currentCaptainIndex].name}!`;

                    setTimeout(() => {
                        modal.style.display = 'none';
                        
                        // Add player to team roster
                        teams[currentCaptainIndex].roster.push({
                            name: chosenPlayer,
                            role: pots[potNum].role
                        });

                        // Advance turn
                        currentCaptainIndex++;
                        if (currentCaptainIndex >= teams.length) {
                            currentCaptainIndex = 0;
                            currentRound++;
                        }
                        updateDraftUI();
                    }, 1200);
                }
            }, 80);
        }

        function renderLiveTeams() {
            const container = document.getElementById('live-teams-container');
            container.innerHTML = '';
            teams.forEach(t => {
                container.innerHTML += `
                    <div class="team-card">
                        <h4>${t.name}</h4>
                        <ul>
                            ${t.roster.map(p => `<li>${p.name} <span class="role">${p.role}</span></li>`).join('')}
                        </ul>
                    </div>
                `;
            });
        }

        function renderFinalTeams() {
            const container = document.getElementById('final-teams-container');
            container.innerHTML = '';
            teams.forEach(t => {
                container.innerHTML += `
                    <div class="team-card">
                        <h4>${t.name}</h4>
                        <ul>
                            ${t.roster.map(p => `<li>${p.name} <span class="role">${p.role}</span></li>`).join('')}
                        </ul>
                    </div>
                `;
            });
        }

        function resetDraft() {
            // Restore players to pots
            pots[1].players = ["Chekwube", "Mr Val", "Obinmna", "Olago"];
            pots[2].players = ["Ebuka", "Osy", "Ifeanyi", "Chidi"];
            pots[3].players = ["Nweke", "Sammy", "Ibro", "Otigba"];
            pots[4].players = ["Ekene", "Psalmz", "Vincent", "Chigbo"];
            pots[5].players = ["Smart", "Stan", "Kodiri", "Emeka"];
            pots[6].players = ["CJ", "Emmy", "Chibuike", "Somto"];

            document.getElementById('screen-result').classList.remove('active');
            document.getElementById('screen-pots').classList.add('active');
            initPotsPreview();
        }
    </script>
</body>
</html>
