<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunday FC - Tournament Draft</title>
    <style>
        :root {
            --pitch-dark: #0d4a22;
            --pitch-light: #125c2b;
            --pitch-line: rgba(255, 255, 255, 0.15);
            --white: #ffffff;
            --accent: #38bdf8;
            --primary: #10b981;
            --primary-dark: #059669;
            --card-bg: rgba(13, 74, 34, 0.85);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--pitch-dark);
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Top Header Navigation */
        .top-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            border: 1px solid var(--pitch-line);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }

        .brand-icon {
            background: var(--primary);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
        }

        .brand-text h1 {
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .brand-text p {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.7);
        }

        .date-badge {
            background: var(--card-bg);
            border: 1px solid var(--pitch-line);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
        }

        /* Main Container Card */
        .container {
            width: 100%;
            max-width: 850px;
            background: rgba(18, 92, 43, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 36px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .section-tag {
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
        }

        h2.title {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 28px;
        }

        /* Pots Overview Grid */
        .pots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }

        .pot-card {
            background: rgba(13, 74, 34, 0.7);
            border: 1px solid var(--pitch-line);
            border-radius: 12px;
            padding: 16px;
        }

        .pot-card h3 {
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pot-card h3 span {
            font-size: 0.7rem;
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .pot-role {
            font-size: 0.75rem;
            color: #a7f3d0;
            margin-bottom: 8px;
            display: block;
        }

        .pot-card ul {
            list-style: none;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .pot-card li {
            padding: 3px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.08);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        /* Draft Arena */
        .draft-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(13, 74, 34, 0.8);
            padding: 16px 20px;
            border-radius: 14px;
            margin-bottom: 24px;
            border-left: 4px solid var(--accent);
        }

        .current-picker-info h2 {
            font-size: 1.2rem;
            color: #a7f3d0;
            text-align: left;
        }

        .round-badge {
            background: rgba(18, 92, 43, 0.9);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .pots-selection-box {
            background: rgba(13, 74, 34, 0.6);
            border: 1px solid var(--pitch-line);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .pots-selection-box h3 {
            font-size: 1rem;
            margin-bottom: 14px;
            color: var(--white);
        }

        .pot-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .pot-pick-btn {
            background: rgba(18, 92, 43, 0.9);
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            text-align: left;
        }

        .pot-pick-btn:hover:not(:disabled) {
            background: var(--accent);
            color: var(--pitch-dark);
            border-color: var(--accent);
            font-weight: bold;
        }

        .pot-pick-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .pot-pick-btn span {
            display: block;
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* Teams Grid */
        .teams-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .team-card {
            background: rgba(13, 74, 34, 0.75);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--pitch-line);
        }

        .team-card h4 {
            color: #a7f3d0;
            font-size: 1.05rem;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }

        .team-card ul {
            list-style: none;
            font-size: 0.9rem;
        }

        .team-card li {
            padding: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }

        .team-card li span.role {
            font-size: 0.7rem;
            color: var(--accent);
            background: rgba(56, 189, 248, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Roulette Animation Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: var(--pitch-light);
            padding: 36px;
            border-radius: 20px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            border: 1px solid var(--accent);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .roulette-box {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            margin: 20px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(13, 74, 34, 0.8);
            border-radius: 12px;
            border: 1px solid var(--pitch-line);
        }

        .nav-hub-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .nav-hub-link:hover {
            color: var(--accent);
            text-decoration: underline;
        }
    </style>
</head>
<body>

            <div class="brand-text">

            </div>

        <div class="date-badge" id="current-date">Sunday, Dec 2026</div>
    </div>

        <div id="screen-pots" class="screen active">
